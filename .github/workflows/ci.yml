name: CI

# Free on GitHub Actions: unlimited on public repos, 2,000 min/month free
# on private repos (as of 2026 -- see github.com/pricing). This workflow
# is deliberately cheap: no matrix builds, no Postgres service container
# for the default job (SQLite path is what's tested here, matching what
# actually ships) -- keeping minute usage low if this repo is ever private.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Run evaluation benchmark
        run: python evaluations/benchmark.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    # Only runs on main, and only after both test jobs pass -- this is the
    # actual point of wiring deploys through Actions instead of letting
    # Render/Vercel's own GitHub auto-deploy fire independently: a failing
    # test should block a deploy, not race it.
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set -- skipping (see README's Deploy for free section)"
          else
            curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          fi

      - name: Trigger Vercel deploy
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret not set -- skipping (see README's Deploy for free section)"
          else
            curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          fi
